  <!--

  <!-- 디자인 스펙 6절 — 브라우저 크롬 UI 색을 앱 배경(#0F0F23)과 통일 -->

  <meta property="og:type" content="website">
  <meta property="og:title" content="VISION VIBE | 브라우저 비전 놀이터">
  <meta property="og:description" content="카메라로 놀고, 보고, 만드는 6가지 실시간 비전 체험">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="VISION VIBE | 브라우저 비전 놀이터">

  <title>VISION VIBE | 브라우저 비전 놀이터</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // 디자인 스펙 4절 2안 — 1차 방법(`MediaQuery.disableAnimations`)이 Flutter
    // 3.41.7 웹에서 브라우저의 prefers-reduced-motion 을 반영하지 않는 것을
    // 라이브로 실측 확인(matchMedia 는 true 인데 카운트다운이 그대로 재생됨)해
    // 스펙이 지정한 matchMedia 브릿지를 추가했다.
    window.prefersReducedMotion = function () {
      return matchMedia('(prefers-reduced-motion: reduce)').matches;
    };
  </script>
</head>
<body>
  <!-- 탭 1: 손만 감지 -->
  <div id="mp-root-hand" style="position:relative; width:640px; height:480px;">
    <video id="mp-video-hand" style="display:none;" playsinline></video>
    <canvas id="mp-canvas-hand" width="640" height="480"></canvas>
  </div>

  <!-- 탭 2: 손+얼굴 동시 감지 -->
  <div id="mp-root-handface" style="position:relative; width:640px; height:480px;">
    <video id="mp-video-handface" style="display:none;" playsinline></video>
    <canvas id="mp-canvas-handface" width="640" height="480"></canvas>
  </div>

  <!-- 탭 3: 사물인식 (이름+확률 표시) -->
  <div id="mp-root-object" style="position:relative; width:640px; height:480px;">
    <video id="mp-video-object" style="display:none;" playsinline></video>
    <canvas id="mp-canvas-object" width="640" height="480"></canvas>
  </div>

  <!-- 탭 4: 가위바위보 (mediapipe1_hand_lite/hand_lite/gesture.py 판정 로직 JS 포팅) -->
  <div id="mp-root-rps" style="position:relative; width:640px; height:480px;">
    <video id="mp-video-rps" style="display:none;" playsinline></video>
    <canvas id="mp-canvas-rps" width="640" height="480"></canvas>
  </div>

  <!-- 탭 5: 마법 지팡이 (opencv1_magic_wand 색상추적 JS 포팅) -->
  <div id="mp-root-magicwand" style="position:relative; width:640px; height:480px;">
    <video id="mp-video-magicwand" style="display:none;" playsinline></video>
    <canvas id="mp-canvas-magicwand" width="640" height="480"></canvas>
  </div>

  <!-- 탭 6: 문서 스캔 (opencv3_doc_scanner opencv.js 포팅) — 라이브 미리보기 + 결과 -->
  <!-- Dart 쪽 SizedBox(_liveWidth/_liveHeight, doc_scanner_tab.dart)와 이 div
       크기를 반드시 일치시킨다 — 다르면 Flutter platform view wrapper와 실제
       DOM 크기가 어긋나 컨텐츠가 넘치거나 짤린다. 캔버스 픽셀 해상도(640x480)는
       카메라 캡처 품질용이라 그대로 두고, style 로 표시 크기만 축소한다. -->
  <div id="mp-root-docscan-live" style="position:relative; width:360px; height:270px;">
    <video id="mp-video-docscan" style="display:none;" playsinline></video>
    <canvas id="mp-canvas-docscan" width="640" height="480" style="width:100%; height:100%;"></canvas>
  </div>
  <div id="mp-root-docscan-result" style="position:relative; width:140px; height:105px;">
    <canvas id="mp-canvas-docscan-result" style="width:100%; height:100%;"></canvas>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script type="module">
    import {
      HandLandmarker,
      FaceDetector,
      ObjectDetector,
      FilesetResolver,
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";

    const WASM_BASE_URL =
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm";
    const HAND_MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
    // FaceDetector/ObjectDetector는 .task 번들이 없고 .tflite를 그대로 modelAssetPath로 받는다
    // (hand_landmarker와 파일 포맷이 다름 — 버킷을 직접 뒤져서 확인함).
    const FACE_MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite";
    // EfficientDet-Lite2, COCO 80종(person/car/dog/bottle/cell phone 등 범용
    // 카테고리) 사전학습. Lite0보다 무겁지만 더 정확 — Lite0은 근접·핸드헬드
    // 촬영에서 오분류가 심해 교체함(실측: 핸드폰/로션을 전부 같은 라벨로 오인식).
    // 그래도 COCO 카테고리 자체가 범용이라 "정확한 제품명"까지는 못 맞춘다 —
    // 이게 필요하면 결국 YOLO 커스텀 파인튜닝(Part2 방식)으로 가야 한다.
    const OBJECT_MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite";

    // WASM 런타임은 탭 3개가 하나만 공유해서 로드한다 (탭마다 새로 받을 이유가 없다).
    let sharedFilesetPromise = null;
    function getSharedFileset() {
      if (!sharedFilesetPromise) {
        sharedFilesetPromise = FilesetResolver.forVisionTasks(WASM_BASE_URL);
      }
      return sharedFilesetPromise;
    }

    // ── 그리기 헬퍼 (탭마다 필요한 것만 조합해서 쓴다) ──────────────────
    function drawHandLandmarks(ctx, canvas, handsLandmarks) {
      for (const landmarks of handsLandmarks) {
        ctx.strokeStyle = "#00FF00";
        ctx.lineWidth = 3;
        for (const connection of HandLandmarker.HAND_CONNECTIONS) {
          const from = landmarks[connection.start];
          const to = landmarks[connection.end];
          if (!from || !to) continue;
          ctx.beginPath();
          ctx.moveTo(from.x * canvas.width, from.y * canvas.height);
          ctx.lineTo(to.x * canvas.width, to.y * canvas.height);
          ctx.stroke();
        }
        ctx.fillStyle = "#FF0000";
        for (const point of landmarks) {
          ctx.beginPath();
          ctx.arc(point.x * canvas.width, point.y * canvas.height, 5, 0, 2 * Math.PI);
          ctx.fill();
        }
      }
    }

    function drawFaceDetections(ctx, canvas, faceDetections) {
      for (const detection of faceDetections) {
        const box = detection.boundingBox;
        ctx.strokeStyle = "#0080FF";
        ctx.lineWidth = 3;
        ctx.strokeRect(box.originX, box.originY, box.width, box.height);
        ctx.fillStyle = "#FFFF00";
        for (const kp of detection.keypoints || []) {
          ctx.beginPath();
          ctx.arc(kp.x * canvas.width, kp.y * canvas.height, 4, 0, 2 * Math.PI);
          ctx.fill();
        }
      }
    }

    // 사물인식 탭 전용 — 박스 위에 "카테고리명 확률%"을 라벨로 그린다.
    function drawObjectDetections(ctx, canvas, objectDetections) {
      ctx.font = "16px sans-serif";
      for (const detection of objectDetections) {
        const box = detection.boundingBox;
        const top = detection.categories[0];
        ctx.strokeStyle = "#FF8000";
        ctx.lineWidth = 3;
        ctx.strokeRect(box.originX, box.originY, box.width, box.height);

        const label = (top?.categoryName || "?") + " " + Math.round((top?.score || 0) * 100) + "%";
        const textWidth = ctx.measureText(label).width;
        ctx.fillStyle = "#FF8000";
        ctx.fillRect(box.originX, box.originY - 20, textWidth + 8, 20);
        ctx.fillStyle = "#000000";
        ctx.fillText(label, box.originX + 4, box.originY - 5);
      }
    }

    // ── 탭 공통 컨트롤러 팩토리 ────────────────────────────────────────
    // 각 탭은 자기 video/canvas/모델 조합만 다르고, 카메라 열기·rAF 루프·
    // 에러 처리·정리 로직은 완전히 동일해서 하나로 묶었다.
    function createController({ videoId, canvasId, statusEvent, setupModels, detectAndDraw }) {
      const video = document.getElementById(videoId);
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext("2d");

      let models = null;
      let stream = null;
      let rafId = null;
      let lastVideoTime = -1;
      let running = false;

      function emitStatus(status) {
        window.dispatchEvent(new CustomEvent(statusEvent, { detail: { status } }));
      }
      function emitError(err) {
        emitStatus("오류: " + (err && err.message ? err.message : String(err)));
      }
      function releaseResources() {
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }
        video.srcObject = null;
        lastVideoTime = -1;
      }

      function renderLoop() {
        if (!running) return;
        try {
          if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
            lastVideoTime = video.currentTime;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const statusText = detectAndDraw(video, ctx, canvas, models, performance.now());
            emitStatus(statusText);
          }
          rafId = requestAnimationFrame(renderLoop);
        } catch (err) {
          running = false;
          releaseResources();
          emitError(err);
        }
      }

      async function start() {
        if (running) return;
        running = true;
        try {
          if (!models) {
            emitStatus("모델 로딩 중...");
            const fileset = await getSharedFileset();
            // opencv.js(Emscripten 빌드)가 초기화 후 남겨두는 전역 window.Module을
            // MediaPipe의 WASM 글루(마찬가지로 Emscripten 빌드)가 그대로 채택해,
            // 이미 끝난 모듈의 초기화 콜백을 무한 대기하며 렌더러가 멈추는 문제가
            // 있다(통제 실험으로 확인: opencv.js 로드 후 이 삭제 없이는 GPU/CPU
            // delegate 모두 hang, 삭제하면 정상). opencv.js는 이 시점에 이미 자신의
            // 초기화를 끝내고 cv 전역에 결과를 옮겨둔 뒤라, window.Module을 지워도
            // 마법 지팡이/문서 스캔 탭 기능에는 영향이 없다.
            delete window.Module;
            models = await setupModels(fileset);
          }

          emitStatus("카메라 권한 요청 중...");
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error(
              "이 브라우저·주소에서는 카메라를 사용할 수 없습니다 (HTTPS 또는 localhost 필요)"
            );
          }
          stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 640, height: 480 },
            audio: false,
          });
          video.srcObject = stream;
          await video.play();

          lastVideoTime = -1;
          rafId = requestAnimationFrame(renderLoop);
        } catch (err) {
          running = false;
          releaseResources();
          emitError(err);
        }
      }

      function stop() {
        running = false;
        releaseResources();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        emitStatus("중지됨");
      }

      return { start, stop };
    }

    // ── 탭 1: 손만 ──────────────────────────────────────────────────
    const handOnly = createController({
      videoId: "mp-video-hand",
      canvasId: "mp-canvas-hand",
      statusEvent: "handOnlyStatus",
      setupModels: async (fileset) => ({
        hand: await HandLandmarker.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: HAND_MODEL_URL, delegate: "GPU" },
          runningMode: "VIDEO",
          numHands: 2,
        }),
      }),
      detectAndDraw: (video, ctx, canvas, models, now) => {
        const result = models.hand.detectForVideo(video, now);
        const landmarks = result.landmarks || [];
        drawHandLandmarks(ctx, canvas, landmarks);
        return "감지 중 (손 " + landmarks.length + "개)";
      },
    });

    // ── 탭 2: 손+얼굴 ────────────────────────────────────────────────
    const handFace = createController({
      videoId: "mp-video-handface",
      canvasId: "mp-canvas-handface",
      statusEvent: "handFaceStatus",
      setupModels: async (fileset) => ({
        hand: await HandLandmarker.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: HAND_MODEL_URL, delegate: "GPU" },
          runningMode: "VIDEO",
          numHands: 2,
        }),
        face: await FaceDetector.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: FACE_MODEL_URL, delegate: "GPU" },
          runningMode: "VIDEO",
        }),
      }),
      detectAndDraw: (video, ctx, canvas, models, now) => {
        const handResult = models.hand.detectForVideo(video, now);
        const faceResult = models.face.detectForVideo(video, now);
        const landmarks = handResult.landmarks || [];
        const faces = faceResult.detections || [];
        drawHandLandmarks(ctx, canvas, landmarks);
        drawFaceDetections(ctx, canvas, faces);
        return "감지 중 (손 " + landmarks.length + "개, 얼굴 " + faces.length + "개)";
      },
    });

    // ── 탭 3: 사물인식 (이름+확률) ──────────────────────────────────
    const objectOnly = createController({
      videoId: "mp-video-object",
      canvasId: "mp-canvas-object",
      statusEvent: "objectOnlyStatus",
      setupModels: async (fileset) => ({
        object: await ObjectDetector.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: OBJECT_MODEL_URL, delegate: "GPU" },
          runningMode: "VIDEO",
          // 0.5는 근접 촬영 물체를 자주 걸러내서 0.3으로 낮췄다 — 오탐이 늘 수
          // 있지만, 워크샵 데모에서는 "아예 안 뜬다"보다 "후보가 뜬다"가 낫다.
          scoreThreshold: 0.3,
          maxResults: 5,
        }),
      }),
      detectAndDraw: (video, ctx, canvas, models, now) => {
        const result = models.object.detectForVideo(video, now);
        const detections = result.detections || [];
        drawObjectDetections(ctx, canvas, detections);
        const top = detections[0]?.categories[0];
        const topLabel = top ? " (1위: " + top.categoryName + " " + Math.round(top.score * 100) + "%)" : "";
        return "감지 중 (사물 " + detections.length + "개)" + topLabel;
      },
    });

    // ── 탭 4: 가위바위보 ────────────────────────────────────────────
    // 판정 로직은 mediapipe1_hand_lite/hand_lite/gesture.py를 그대로 JS로
    // 포팅했다 — 실사진 6장(../yolo1_rps/tests/fixtures/)으로 이미 6/6
    // 검증된 알고리즘이라 새로 튜닝하지 않는다. 좌표계(정규화 0~1, y는
    // 위쪽일수록 작음)도 Python HandResult와 동일해 그대로 옮길 수 있었다.
    const RPS_INDEX = [5, 6, 7, 8];
    const RPS_MIDDLE = [9, 10, 11, 12];
    const RPS_RING = [13, 14, 15, 16];
    const RPS_PINKY = [17, 18, 19, 20];
    const RPS_WRIST = 0;
    const RPS_THUMB_TIP = 4;
    const RPS_INDEX_MCP = 5;
    const RPS_MIDDLE_MCP = 9;
    // gesture.py와 동일한 임계값 — 실사진 6장 실측 기준 결정(주석은 원본 참고).
    const RPS_THUMB_SPREAD_RATIO_THRESHOLD = 0.57;

    function rpsDist(lm, a, b) {
      return Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y);
    }
    function rpsIsExtended(lm, finger) {
      const pip = finger[1];
      const tip = finger[3];
      return lm[tip].y < lm[pip].y;
    }
    function rpsFingersUp(lm) {
      const index = rpsIsExtended(lm, RPS_INDEX);
      const middle = rpsIsExtended(lm, RPS_MIDDLE);
      const ring = rpsIsExtended(lm, RPS_RING);
      const pinky = rpsIsExtended(lm, RPS_PINKY);
      const handSize = rpsDist(lm, RPS_WRIST, RPS_MIDDLE_MCP);
      let thumb = false;
      if (handSize > 0) {
        const spreadRatio = rpsDist(lm, RPS_THUMB_TIP, RPS_INDEX_MCP) / handSize;
        thumb = spreadRatio > RPS_THUMB_SPREAD_RATIO_THRESHOLD;
      }
      return { thumb, index, middle, ring, pinky };
    }
    // 가위 판정에서 엄지는 무시한다 — 실제 사람은 가위를 낼 때 엄지를
    // 벌린 채로 내기 때문(원본 gesture.py 주석과 동일한 이유).
    function classifyGesture(lm) {
      if (!lm || lm.length !== 21) return "UNKNOWN";
      const { thumb, index, middle, ring, pinky } = rpsFingersUp(lm);
      const any = thumb || index || middle || ring || pinky;
      const all = thumb && index && middle && ring && pinky;
      if (!any) return "ROCK";
      if (all) return "PAPER";
      if (index && middle && !ring && !pinky) return "SCISSORS";
      return "UNKNOWN";
    }

    const RPS_LABEL_KO = { ROCK: "바위 ✊", PAPER: "보 ✋", SCISSORS: "가위 ✌️", UNKNOWN: "인식 안 됨" };

    function judgeRps(player, ai) {
      if (player === "UNKNOWN" || ai === "UNKNOWN") return "판정불가";
      if (player === ai) return "무승부";
      const beats = { ROCK: "SCISSORS", SCISSORS: "PAPER", PAPER: "ROCK" };
      return beats[player] === ai ? "승리" : "패배";
    }

    let rpsLastGesture = "UNKNOWN";
    let rpsAiMove = null;
    let rpsResultText = "";

    const rpsOnly = createController({
      videoId: "mp-video-rps",
      canvasId: "mp-canvas-rps",
      statusEvent: "rpsStatus",
      setupModels: async (fileset) => ({
        hand: await HandLandmarker.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: HAND_MODEL_URL, delegate: "GPU" },
          runningMode: "VIDEO",
          numHands: 1,
        }),
      }),
      detectAndDraw: (video, ctx, canvas, models, now) => {
        const result = models.hand.detectForVideo(video, now);
        const landmarksList = result.landmarks || [];
        drawHandLandmarks(ctx, canvas, landmarksList);

        rpsLastGesture = landmarksList.length > 0 ? classifyGesture(landmarksList[0]) : "UNKNOWN";

        ctx.font = "bold 28px sans-serif";
        ctx.fillStyle = "#00FFAA";
        ctx.fillText("내 패: " + RPS_LABEL_KO[rpsLastGesture], 10, 35);
        if (rpsAiMove) {
          ctx.fillStyle = "#FFAA00";
          ctx.fillText("AI 패: " + RPS_LABEL_KO[rpsAiMove], 10, 70);
        }
        if (rpsResultText) {
          ctx.fillStyle = "#FFFFFF";
          ctx.fillText(rpsResultText, 10, 105);
        }

        return "인식 중 (" + rpsLastGesture + ")";
      },
    });

    // "판정!" 버튼에서 호출 — 현재 프레임의 내 패를 고정하고 AI는 무작위로 낸다.
    // 승패 판정은 순수 규칙(가위>보>바위>가위)이며 모델에 묻지 않는다.
    window.playRpsRound = function () {
      const moves = ["ROCK", "PAPER", "SCISSORS"];
      rpsAiMove = moves[Math.floor(Math.random() * moves.length)];
      const result = judgeRps(rpsLastGesture, rpsAiMove);
      rpsResultText =
        "내 패: " + RPS_LABEL_KO[rpsLastGesture] + " vs AI: " + RPS_LABEL_KO[rpsAiMove] + " -> " + result;
      window.dispatchEvent(
        new CustomEvent("rpsRoundResult", {
          detail: { player: rpsLastGesture, ai: rpsAiMove, result: result },
        })
      );
    };

    window.startHandOnly = handOnly.start;
    window.stopHandOnly = handOnly.stop;
    window.startHandFace = handFace.start;
    window.stopHandFace = handFace.stop;
    window.startObjectOnly = objectOnly.start;
    window.stopObjectOnly = objectOnly.stop;
    window.startRps = rpsOnly.start;
    window.stopRps = rpsOnly.stop;
  </script>

  <!-- 마법 지팡이(순수 Canvas, opencv.js 불필요) — 위 모듈 스크립트와 독립적으로 동작한다 -->
  <script src="js/magic_wand.js"></script>

  <!-- 문서 스캔 — opencv.js(WASM) 로드 후 사용. 로드는 비동기라 doc_scanner.js
       내부에서 cv 준비 여부를 매 호출마다 확인한다(위 주석 참고). -->
  <script async src="https://docs.opencv.org/4.9.0/opencv.js"></script>
  <script src="js/doc_scanner.js"></script>
</body>
