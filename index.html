<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/vision-vibe/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="part3_flutter_web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>part3_flutter_web</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 탭 1: 손만 감지 -->
  <div id="mp-root-hand" style="position:relative; width:640px; height:480px;">
    <video id="mp-video-hand" style="display:none;" playsinline></video>
    <canvas id="mp-canvas-hand" width="640" height="480"></canvas>
  </div>

  <!-- 탭 2: 손+얼굴 동시 감지 -->
  <div id="mp-root-handface" style="position:relative; width:640px; height:480px;">
    <video id="mp-video-handface" style="display:none;" playsinline></video>
    <canvas id="mp-canvas-handface" width="640" height="480"></canvas>
  </div>

  <!-- 탭 3: 사물인식 (이름+확률 표시) -->
  <div id="mp-root-object" style="position:relative; width:640px; height:480px;">
    <video id="mp-video-object" style="display:none;" playsinline></video>
    <canvas id="mp-canvas-object" width="640" height="480"></canvas>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script type="module">
    import {
      HandLandmarker,
      FaceDetector,
      ObjectDetector,
      FilesetResolver,
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";

    const WASM_BASE_URL =
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm";
    const HAND_MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
    // FaceDetector/ObjectDetector는 .task 번들이 없고 .tflite를 그대로 modelAssetPath로 받는다
    // (hand_landmarker와 파일 포맷이 다름 — 버킷을 직접 뒤져서 확인함).
    const FACE_MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite";
    // EfficientDet-Lite2, COCO 80종(person/car/dog/bottle/cell phone 등 범용
    // 카테고리) 사전학습. Lite0보다 무겁지만 더 정확 — Lite0은 근접·핸드헬드
    // 촬영에서 오분류가 심해 교체함(실측: 핸드폰/로션을 전부 같은 라벨로 오인식).
    // 그래도 COCO 카테고리 자체가 범용이라 "정확한 제품명"까지는 못 맞춘다 —
    // 이게 필요하면 결국 YOLO 커스텀 파인튜닝(Part2 방식)으로 가야 한다.
    const OBJECT_MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite";

    // WASM 런타임은 탭 3개가 하나만 공유해서 로드한다 (탭마다 새로 받을 이유가 없다).
    let sharedFilesetPromise = null;
    function getSharedFileset() {
      if (!sharedFilesetPromise) {
        sharedFilesetPromise = FilesetResolver.forVisionTasks(WASM_BASE_URL);
      }
      return sharedFilesetPromise;
    }

    // ── 그리기 헬퍼 (탭마다 필요한 것만 조합해서 쓴다) ──────────────────
    function drawHandLandmarks(ctx, canvas, handsLandmarks) {
      for (const landmarks of handsLandmarks) {
        ctx.strokeStyle = "#00FF00";
        ctx.lineWidth = 3;
        for (const connection of HandLandmarker.HAND_CONNECTIONS) {
          const from = landmarks[connection.start];
          const to = landmarks[connection.end];
          if (!from || !to) continue;
          ctx.beginPath();
          ctx.moveTo(from.x * canvas.width, from.y * canvas.height);
          ctx.lineTo(to.x * canvas.width, to.y * canvas.height);
          ctx.stroke();
        }
        ctx.fillStyle = "#FF0000";
        for (const point of landmarks) {
          ctx.beginPath();
          ctx.arc(point.x * canvas.width, point.y * canvas.height, 5, 0, 2 * Math.PI);
          ctx.fill();
        }
      }
    }

    function drawFaceDetections(ctx, canvas, faceDetections) {
      for (const detection of faceDetections) {
        const box = detection.boundingBox;
        ctx.strokeStyle = "#0080FF";
        ctx.lineWidth = 3;
        ctx.strokeRect(box.originX, box.originY, box.width, box.height);
        ctx.fillStyle = "#FFFF00";
        for (const kp of detection.keypoints || []) {
          ctx.beginPath();
          ctx.arc(kp.x * canvas.width, kp.y * canvas.height, 4, 0, 2 * Math.PI);
          ctx.fill();
        }
      }
    }

    // 사물인식 탭 전용 — 박스 위에 "카테고리명 확률%"을 라벨로 그린다.
    function drawObjectDetections(ctx, canvas, objectDetections) {
      ctx.font = "16px sans-serif";
      for (const detection of objectDetections) {
        const box = detection.boundingBox;
        const top = detection.categories[0];
        ctx.strokeStyle = "#FF8000";
        ctx.lineWidth = 3;
        ctx.strokeRect(box.originX, box.originY, box.width, box.height);

        const label = (top?.categoryName || "?") + " " + Math.round((top?.score || 0) * 100) + "%";
        const textWidth = ctx.measureText(label).width;
        ctx.fillStyle = "#FF8000";
        ctx.fillRect(box.originX, box.originY - 20, textWidth + 8, 20);
        ctx.fillStyle = "#000000";
        ctx.fillText(label, box.originX + 4, box.originY - 5);
      }
    }

    // ── 탭 공통 컨트롤러 팩토리 ────────────────────────────────────────
    // 각 탭은 자기 video/canvas/모델 조합만 다르고, 카메라 열기·rAF 루프·
    // 에러 처리·정리 로직은 완전히 동일해서 하나로 묶었다.
    function createController({ videoId, canvasId, statusEvent, setupModels, detectAndDraw }) {
      const video = document.getElementById(videoId);
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext("2d");

      let models = null;
      let stream = null;
      let rafId = null;
      let lastVideoTime = -1;
      let running = false;

      function emitStatus(status) {
        window.dispatchEvent(new CustomEvent(statusEvent, { detail: { status } }));
      }
      function emitError(err) {
        emitStatus("오류: " + (err && err.message ? err.message : String(err)));
      }
      function releaseResources() {
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }
        video.srcObject = null;
        lastVideoTime = -1;
      }

      function renderLoop() {
        if (!running) return;
        try {
          if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
            lastVideoTime = video.currentTime;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const statusText = detectAndDraw(video, ctx, canvas, models, performance.now());
            emitStatus(statusText);
          }
          rafId = requestAnimationFrame(renderLoop);
        } catch (err) {
          running = false;
          releaseResources();
          emitError(err);
        }
      }

      async function start() {
        if (running) return;
        running = true;
        try {
          if (!models) {
            emitStatus("모델 로딩 중...");
            const fileset = await getSharedFileset();
            models = await setupModels(fileset);
          }

          emitStatus("카메라 권한 요청 중...");
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error(
              "이 브라우저·주소에서는 카메라를 사용할 수 없습니다 (HTTPS 또는 localhost 필요)"
            );
          }
          stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 640, height: 480 },
            audio: false,
          });
          video.srcObject = stream;
          await video.play();

          lastVideoTime = -1;
          rafId = requestAnimationFrame(renderLoop);
        } catch (err) {
          running = false;
          releaseResources();
          emitError(err);
        }
      }

      function stop() {
        running = false;
        releaseResources();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        emitStatus("중지됨");
      }

      return { start, stop };
    }

    // ── 탭 1: 손만 ──────────────────────────────────────────────────
    const handOnly = createController({
      videoId: "mp-video-hand",
      canvasId: "mp-canvas-hand",
      statusEvent: "handOnlyStatus",
      setupModels: async (fileset) => ({
        hand: await HandLandmarker.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: HAND_MODEL_URL, delegate: "GPU" },
          runningMode: "VIDEO",
          numHands: 2,
        }),
      }),
      detectAndDraw: (video, ctx, canvas, models, now) => {
        const result = models.hand.detectForVideo(video, now);
        const landmarks = result.landmarks || [];
        drawHandLandmarks(ctx, canvas, landmarks);
        return "감지 중 (손 " + landmarks.length + "개)";
      },
    });

    // ── 탭 2: 손+얼굴 ────────────────────────────────────────────────
    const handFace = createController({
      videoId: "mp-video-handface",
      canvasId: "mp-canvas-handface",
      statusEvent: "handFaceStatus",
      setupModels: async (fileset) => ({
        hand: await HandLandmarker.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: HAND_MODEL_URL, delegate: "GPU" },
          runningMode: "VIDEO",
          numHands: 2,
        }),
        face: await FaceDetector.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: FACE_MODEL_URL, delegate: "GPU" },
          runningMode: "VIDEO",
        }),
      }),
      detectAndDraw: (video, ctx, canvas, models, now) => {
        const handResult = models.hand.detectForVideo(video, now);
        const faceResult = models.face.detectForVideo(video, now);
        const landmarks = handResult.landmarks || [];
        const faces = faceResult.detections || [];
        drawHandLandmarks(ctx, canvas, landmarks);
        drawFaceDetections(ctx, canvas, faces);
        return "감지 중 (손 " + landmarks.length + "개, 얼굴 " + faces.length + "개)";
      },
    });

    // ── 탭 3: 사물인식 (이름+확률) ──────────────────────────────────
    const objectOnly = createController({
      videoId: "mp-video-object",
      canvasId: "mp-canvas-object",
      statusEvent: "objectOnlyStatus",
      setupModels: async (fileset) => ({
        object: await ObjectDetector.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: OBJECT_MODEL_URL, delegate: "GPU" },
          runningMode: "VIDEO",
          // 0.5는 근접 촬영 물체를 자주 걸러내서 0.3으로 낮췄다 — 오탐이 늘 수
          // 있지만, 워크샵 데모에서는 "아예 안 뜬다"보다 "후보가 뜬다"가 낫다.
          scoreThreshold: 0.3,
          maxResults: 5,
        }),
      }),
      detectAndDraw: (video, ctx, canvas, models, now) => {
        const result = models.object.detectForVideo(video, now);
        const detections = result.detections || [];
        drawObjectDetections(ctx, canvas, detections);
        const top = detections[0]?.categories[0];
        const topLabel = top ? " (1위: " + top.categoryName + " " + Math.round(top.score * 100) + "%)" : "";
        return "감지 중 (사물 " + detections.length + "개)" + topLabel;
      },
    });

    window.startHandOnly = handOnly.start;
    window.stopHandOnly = handOnly.stop;
    window.startHandFace = handFace.start;
    window.stopHandFace = handFace.stop;
    window.startObjectOnly = objectOnly.start;
    window.stopObjectOnly = objectOnly.stop;
  </script>
</body>
</html>
